<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Martinez Road Network Visualization Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-tile@1"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ CA Martinez Road Network Visualization</h1>
            <p>Interactive Geographic Data Dashboard - Built with D3.js</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Road Width:</label>
                <input type="range" id="strokeWidth" min="0.5" max="3" step="0.1" value="0.5">
                <span id="strokeWidthValue">0.5</span>
            </div>
            <div class="control-group">
                <label>Opacity:</label>
                <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.6">
                <span id="opacityValue">0.6</span>
            </div>
            <div class="control-group">
                <label>Filter by Type:</label>
                <select id="typeFilter">
                    <option value="">All Types</option>
                </select>
            </div>
            <div class="search-group">
                <label>Search by ID:</label>
                <input type="text" id="idSearch" placeholder="Enter road ID">
                <button id="searchById">Search</button>
                <button id="clearSearch">Clear</button>
            </div>
            <button id="resetView">Reset View</button>
            <button id="fitBounds">Fit Bounds</button>
            <button id="toggleLabels">Toggle Labels</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Number of Road Segments</div>
                <div class="stat-value" id="roadCount">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Length (meters)</div>
                <div class="stat-value" id="totalLength">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Current Zoom Level</div>
                <div class="stat-value" id="zoomLevel">1.0x</div>
            </div>
        </div>

        <div id="map-container">
            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <div>Loading geographic data...</div>
            </div>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoomIn">+</button>
                <button class="zoom-btn" id="zoomOut">−</button>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color"></div>
                    <span>Road Network</span>
                </div>
                <div style="margin-top: 10px; font-size: 11px; color: #666;">
                    💡 Tip: Use mouse wheel to zoom, drag to pan
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
